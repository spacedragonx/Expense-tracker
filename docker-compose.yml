services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: expense-tracker-backend:latest
    container_name: expense-tracker-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env          # real secrets live here, never committed
    environment:
      PORT: 5000
      NODE_ENV: production
    expose:
      - "5000"                   # only reachable by other containers on this network
    networks:
      - expense-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api    # relative path, resolved by Nginx's proxy below
    image: expense-tracker-frontend:latest
    container_name: expense-tracker-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"                    # exposed to the host / internet
    networks:
      - expense-net

networks:
  expense-net:
    driver: bridge
