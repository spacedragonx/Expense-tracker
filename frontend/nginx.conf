server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- API reverse proxy ---
    # Same-origin proxying is what lets the backend's httpOnly JWT cookie
    # work without cross-site cookie complications.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # --- Static assets: long-lived cache ---
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback: client-side routing (react-router) ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
